<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solus FX. Animation that explains what you do.</title>
<meta name="description" content="Solus FX. Animated explainers, sports animation and product films.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

:root{
  --paper:#efe8d8; --cell:#f6f1e5; --ink:#15130f; --red:#e3411d; --mute:#5c574d;
  --rule:1.5px solid var(--ink);
  --disp:"Archivo","Arial Narrow",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --pad:clamp(12px,2.3vw,32px); --in:clamp(10px,1vw,14px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--disp);-webkit-font-smoothing:antialiased;padding:var(--pad)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.sheet{max-width:1640px;margin-inline:auto;border:var(--rule);background:var(--paper)}
.cond{font-family:var(--disp);font-stretch:62%;font-weight:800;text-transform:uppercase;letter-spacing:-.005em}
.mono{font:500 12px/1.2 var(--mono);letter-spacing:.04em;text-transform:uppercase}

/* header */
.top{display:flex;align-items:stretch;border-bottom:var(--rule)}
.mark{flex:1;display:flex;align-items:center;padding:14px clamp(14px,1.6vw,24px);font-size:clamp(26px,2.4vw,34px);line-height:1;white-space:nowrap}
.nav{display:flex}
.nav a{display:flex;align-items:center;padding:0 clamp(12px,1.7vw,26px);border-left:var(--rule);font:500 12.5px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;transition:background .15s,color .15s}
.nav a:hover{background:var(--ink);color:var(--paper)}
.nav a.cta{background:var(--red);color:#fff}

/* hero */
.hero{display:grid;grid-template-columns:3fr 2fr;border-bottom:var(--rule)}
.hero-l{display:flex;flex-direction:column;justify-content:space-between;gap:36px;padding:clamp(16px,1.9vw,28px);min-width:0}
.hero-l .mono{display:flex;justify-content:space-between;gap:16px;color:var(--mute)}
h1{font-size:clamp(58px,9.3vw,136px);line-height:.85;margin:0}
.hero-b{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 32px;align-items:end;border-top:var(--rule);padding-top:clamp(16px,1.6vw,22px)}
.lede{margin:0;font-size:clamp(16.5px,1.4vw,20px);line-height:1.4;font-weight:500;max-width:27em}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:12px;font:700 15.5px/1 var(--disp);padding:17px 22px;border:var(--rule);background:var(--ink);color:var(--paper);transition:transform .15s,box-shadow .15s}
.btn.alt{background:transparent;color:var(--ink)}
.btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.btn.on-red:hover{box-shadow:4px 4px 0 rgba(21,19,15,.35)}
.hero-r{background:var(--red);border-left:var(--rule);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(16px,1.8vw,26px);padding:clamp(24px,3vw,44px) 20px clamp(16px,1.6vw,22px);position:relative}
.film{position:relative;display:block;width:min(100%,clamp(220px,25vw,372px));aspect-ratio:9/16;border:var(--rule);box-shadow:clamp(6px,.8vw,12px) clamp(6px,.8vw,12px) 0 var(--ink);background:var(--ink)}
.film img{width:100%;height:100%;object-fit:cover}
.play{position:absolute;left:14px;bottom:14px;width:60px;height:60px;border-radius:50%;background:var(--paper);border:var(--rule);display:grid;place-items:center}
.play svg{width:17px;height:17px;margin-left:3px}
.hero-r .mono{align-self:stretch;display:flex;justify-content:space-between;gap:12px;color:var(--ink);padding-inline:4px}

/* section bars */
.bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:end;gap:10px clamp(14px,2vw,28px);padding:clamp(34px,4.6vw,68px) clamp(14px,1.9vw,28px) clamp(12px,1.3vw,18px);border-bottom:var(--rule)}
.bar .mono{padding-bottom:.9em}
h2{font-size:clamp(50px,7.6vw,118px);line-height:.82;margin:0}

/* ruled contact sheet */
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.cell{border-right:var(--rule);border-bottom:var(--rule);padding:var(--in);display:flex;flex-direction:column;min-width:0;background:var(--cell)}
.grid>.cell:nth-child(5n),.grid>.cell.last{border-right:0}
.tile .ph{display:block;position:relative;aspect-ratio:9/16;overflow:hidden;background:var(--ink);border:var(--rule)}
.tile .ph.wide{aspect-ratio:16/9}
.tile .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.tile:hover .ph img{transform:scale(1.03)}
.tile .mono{display:flex;justify-content:space-between;gap:8px;padding-top:11px;color:var(--mute)}
.tile b{display:block;font-size:clamp(22px,1.95vw,28px);line-height:.95;margin-top:9px;transition:color .15s}
.tile:hover b{color:var(--red)}
.tile .d{display:block;font-size:13.5px;line-height:1.38;color:#3b372f;margin-top:7px;padding-bottom:6px}
.feature{grid-column:span 2;grid-row:span 2}
.feature b{font-size:clamp(34px,4.2vw,64px);line-height:.86;margin-top:12px}
.feature .d{font-size:clamp(14px,1.2vw,17px);max-width:26em}
.tag{position:absolute;left:0;top:0;background:var(--red);color:#fff;font:500 11.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;border-right:var(--rule);border-bottom:var(--rule)}
.w2{grid-column:span 2}.w3{grid-column:span 3}
.note{justify-content:space-between;gap:24px;padding:clamp(12px,1.4vw,20px)}
.note p{margin:0;font-size:clamp(24px,2.5vw,38px);line-height:.92}
.note.big p{font-size:clamp(30px,4.3vw,66px);line-height:.88}
.note.ink{background:var(--ink);color:var(--paper)}
.note .go{font:500 12.5px/1.2 var(--mono);letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;border-top:1.5px solid currentColor;padding-top:12px}

/* how */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));counter-reset:s}
.steps li{counter-increment:s;border-right:var(--rule);border-bottom:var(--rule);padding:clamp(14px,1.6vw,24px);min-height:clamp(180px,17vw,250px);display:flex;flex-direction:column;background:var(--cell)}
.steps li:last-child{border-right:0}
.steps .mono{display:flex;justify-content:space-between;color:var(--mute)}
.steps .mono::before{content:"0" counter(s)}
.steps .mono span{color:var(--red);font-size:17px;line-height:.7}
.steps h3{font-size:clamp(34px,3.7vw,56px);line-height:.86;margin:auto 0 10px}
.steps p{margin:0;font-size:15.5px;max-width:19em;color:#3b372f}

/* contact */
.contact{background:var(--red);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px 40px;align-items:end;padding:clamp(40px,6vw,96px) clamp(14px,1.9vw,28px) clamp(20px,2.4vw,36px);border-bottom:var(--rule)}
.contact p{font-size:clamp(54px,9.6vw,150px);line-height:.82;margin:0;max-width:8.6em;text-wrap:balance}
.btn.big{font-size:19px;padding:24px 34px}
.foot{display:flex;justify-content:space-between;gap:16px;padding:14px clamp(14px,1.9vw,28px);color:var(--mute)}

@media (max-width:980px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-r{border-left:0;border-top:var(--rule)}
  .hero-b{grid-template-columns:minmax(0,1fr)}
  h1{font-size:clamp(54px,13.6vw,128px)}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid>.cell:nth-child(5n),.grid>.cell.last{border-right:var(--rule)}
  .feature{grid-row:auto}
  .feature,.w3,.w2.keep{grid-column:span 2;border-right:0!important}
  .w2{grid-column:span 1}
  .grid>.cell.r0{border-right:0}
  .note p,.note.big p{font-size:clamp(24px,6.4vw,44px)}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps li:nth-child(2n){border-right:0}
  .contact{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .top{flex-direction:column}
  .mark{border-bottom:var(--rule);padding-block:12px}
  .nav{overflow-x:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{padding:12px 6px;font-size:10.5px;letter-spacing:.01em;flex:1 1 auto;justify-content:center}
  .steps .mono span{transform:rotate(90deg)}
  .nav a:first-child{border-left:0}
  .hero-l .mono span:last-child{display:none}
  .film{width:min(72%,300px)}
  .actions .btn{flex:1 1 auto;justify-content:center}
  .bar .mono:last-child{grid-column:1/-1;padding-bottom:0}
  .tile .d{font-size:13px}
  .steps{grid-template-columns:minmax(0,1fr)}
  .steps li{border-right:0;min-height:0;gap:26px}
  .btn.big{width:100%;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

</style>
</head>
